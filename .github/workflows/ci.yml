name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check services scripts tests

      - name: Mypy
        run: mypy

      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: frontend (tsc + eslint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  stack:
    name: stack (docker compose smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # NOTE: this job could not be exercised on the development machine (no
    # Docker installed there), so it is written defensively: pinned tags,
    # healthchecks on every service, a generous --wait-timeout, and log dumps
    # on failure. It is the first thing to check on a red run.
    steps:
      - uses: actions/checkout@v4

      - name: Show docker versions
        run: |
          docker --version
          docker compose version

      - name: Prepare env
        run: |
          cp .env.example .env
          mkdir -p models

      - name: Build images
        run: docker compose build

      - name: Up (waits for every healthcheck)
        run: docker compose up -d --wait --wait-timeout 420

      - name: Service state
        run: docker compose ps

      - name: Smoke - API health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            echo "attempt $attempt: API not ready yet"
            sleep 5
          done
          echo "API never became healthy"
          exit 1

      - name: Smoke - API contract
        run: |
          curl -fsS http://localhost:8000/meta/span
          curl -fsS -o /dev/null -w 'openapi: %{http_code}\n' http://localhost:8000/openapi.json
          curl -fsS -o /dev/null -w 'metrics: %{http_code}\n' http://localhost:8000/metrics/cache

      - name: Smoke - dashboard is served
        run: curl -fsS -o /dev/null -w 'web: %{http_code}\n' http://localhost:8080/

      - name: Smoke - Timescale hypertable and continuous aggregate exist
        run: |
          docker compose exec -T timescaledb psql -U urbanpulse -d urbanpulse -c \
            "SELECT hypertable_name FROM timescaledb_information.hypertables;"
          docker compose exec -T timescaledb psql -U urbanpulse -d urbanpulse -c \
            "SELECT view_name FROM timescaledb_information.continuous_aggregates;"

      - name: Smoke - Kafka topic is being produced to
        run: |
          sleep 75  # one poll interval plus slack
          docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --list
          docker compose logs --tail=40 ingest

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Down
        if: always()
        run: docker compose down -v
